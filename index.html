<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Trading Dashboard | Professional Grade</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --primary-dark: #0f172a;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --header-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.5;
        }

        .top-nav {
            background: var(--header-bg);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .logo-area h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            text-transform: uppercase;
        }

        .logo-area span {
            color: #94a3b8;
            font-weight: 400;
            font-size: 0.8rem;
            margin-left: 0.5rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }

        .summary-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .summary-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .controls {
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .search-input {
            flex: 1;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary);
        }

        .select-input {
            padding: 0.6rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background: white;
            font-size: 0.875rem;
        }

        .trader-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .trader-row {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            overflow: hidden;
            transition: border-color 0.2s ease;
        }

        .trader-row:hover {
            border-color: var(--text-muted);
        }

        .trader-row.master {
            border-left: 4px solid var(--primary);
        }

        .row-header {
            padding: 1.25rem 1.5rem;
            display: grid;
            grid-template-columns: 150px 120px 150px 150px 150px 150px 1fr 40px;
            align-items: center;
            cursor: pointer;
        }

        .acc-id { font-weight: 700; color: var(--primary); }
        .master-tag { 
            font-size: 0.65rem; 
            background: var(--primary); 
            color: white; 
            padding: 1px 6px; 
            border-radius: 3px; 
            margin-left: 5px;
        }

        .cell-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
        .cell-value { font-weight: 600; font-size: 0.95rem; }

        .expand-icon { text-align: right; color: var(--text-muted); transition: transform 0.3s; }
        .trader-row.open .expand-icon { transform: rotate(180deg); }

        .row-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            background: #fdfdfd;
            border-top: 1px solid var(--border);
        }

        .trader-row.open .row-detail {
            max-height: 1000px;
        }

        .detail-content {
            padding: 2rem;
        }

        .tabs {
            display: flex;
            gap: 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .tab-item {
            padding: 0.5rem 0;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .pro-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .pro-table th {
            text-align: left;
            padding: 0.75rem 1rem;
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        .pro-table td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
        }

        .pro-table tr:hover { background: #f1f5f9; }

        .val-buy { color: var(--success); }
        .val-sell { color: var(--danger); }
        .val-pos { color: var(--success); }
        .val-neg { color: var(--danger); }

        .badge {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-long { background: #dcfce7; color: #166534; }
        .badge-short { background: #fee2e2; color: #991b1b; }
        .badge-flat { background: #f1f5f9; color: #475569; }

        .loader-overlay {
            position: fixed;
            inset: 0;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .loading-text { margin-top: 1rem; font-weight: 600; color: var(--text-muted); }
    </style>
</head>

<body>
    <div id="loader" class="loader-overlay">
        <div style="width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #1e293b; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <div class="loading-text">Initialising Global Dashboard...</div>
    </div>

    <nav class="top-nav">
        <div class="logo-area">
            <h1>INSTITUTIONAL DASHBOARD <span>V2.0 PRO</span></h1>
        </div>
        <div style="font-size: 0.85rem; font-weight: 600;" id="dateDisplay">DATE: MAY 14, 2026</div>
    </nav>

    <div class="container">
        <div id="globalSummary" class="summary-grid"></div>
        <div class="controls">
            <input type="text" class="search-input" id="searchBox" placeholder="Search by Account ID, Symbol or Side..." oninput="filterData()">
            <select class="select-input" id="posSelect" onchange="filterData()">
                <option value="all">All Positions</option>
                <option value="long">Net Long</option>
                <option value="short">Net Short</option>
                <option value="flat">Square Off</option>
            </select>
            <select class="select-input" id="sortSelect" onchange="sortData()">
                <option value="pl">MTM (P&L)</option>
                <option value="volume">Buy Value</option>
                <option value="trades">Trade Count</option>
                <option value="id">Account ID</option>
            </select>
        </div>
        <div id="traderList" class="trader-list"></div>
    </div>

    <script>
        let allData = [];
        let filteredData = [];

        async function loadDashboard() {
            try {
                // Using ./ path for better compatibility with GitHub Pages
                const res = await fetch('./trader_data.json');
                allData = await res.json();
                filteredData = [...allData];
                
                renderGlobalStats();
                sortData();
                document.getElementById('loader').style.display = 'none';
            } catch (e) {
                console.error(e);
                document.getElementById('loader').innerHTML = '<div style="color:red; padding: 2rem; text-align:center;">Failed to load data. Ensure trader_data.json is available in the root.</div>';
            }
        }

        function renderGlobalStats() {
            const totalPL = allData.reduce((s, t) => s + t.gross_pl, 0);
            const totalBuyVal = allData.reduce((s, t) => s + t.buy_value, 0);
            const totalSellVal = allData.reduce((s, t) => s + t.sell_value, 0);
            const totalTrades = allData.reduce((s, t) => s + t.num_trades, 0);

            document.getElementById('globalSummary').innerHTML = `
                <div class="summary-card">
                    <div class="summary-label">Aggregate Gross P&L (MTM)</div>
                    <div class="summary-value ${totalPL >= 0 ? 'val-pos' : 'val-neg'}">$${formatNum(totalPL)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Total Purchase Value</div>
                    <div class="summary-value">$${formatNum(totalBuyVal)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Total Realization Value</div>
                    <div class="summary-value">$${formatNum(totalSellVal)}</div>
                </div>
                <div class="summary-card">
                    <div class="summary-label">Total Executions</div>
                    <div class="summary-value">${totalTrades.toLocaleString()}</div>
                </div>
            `;
        }

        function renderTraders() {
            const container = document.getElementById('traderList');
            container.innerHTML = filteredData.map((trader, idx) => `
                <div class="trader-row ${trader.is_master ? 'master' : ''}" id="trader-${idx}">
                    <div class="row-header" onclick="toggleRow(${idx})">
                        <div class="acc-id">
                            ${trader.account}${trader.is_master ? '<span class="master-tag">MASTER</span>' : ''}
                        </div>
                        <div>
                            <div class="cell-label">Net Position</div>
                            <div class="cell-value">
                                <span class="badge ${trader.net_position > 0 ? 'badge-long' : trader.net_position < 0 ? 'badge-short' : 'badge-flat'}">
                                    ${trader.net_position > 0 ? '+' : ''}${trader.net_position}
                                </span>
                            </div>
                        </div>
                        <div>
                            <div class="cell-label">Buy Value</div>
                            <div class="cell-value val-buy">$${formatNum(trader.buy_value)}</div>
                        </div>
                        <div>
                            <div class="cell-label">Sell Value</div>
                            <div class="cell-value val-sell">$${formatNum(trader.sell_value)}</div>
                        </div>
                        <div>
                            <div class="cell-label">Avg Buy / Sell</div>
                            <div class="cell-value" style="font-size: 0.8rem">
                                B: ${trader.avg_buy.toFixed(4)} <br/> S: ${trader.avg_sell.toFixed(4)}
                            </div>
                        </div>
                        <div>
                            <div class="cell-label">MTM (Gross P&L)</div>
                            <div class="cell-value ${trader.gross_pl >= 0 ? 'val-pos' : 'val-neg'}">
                                $${formatNum(trader.gross_pl)}
                            </div>
                        </div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); padding-left: 1rem;">
                            Symbols: ${trader.symbols.slice(0, 3).join(', ')}${trader.symbols.length > 3 ? '...' : ''}
                        </div>
                        <div class="expand-icon">▼</div>
                    </div>
                    <div class="row-detail">
                        <div class="detail-content">
                            <div class="tabs">
                                <div class="tab-item active" onclick="switchTab(event, ${idx}, 'pos')">OPEN POSITIONS (${trader.positions.length})</div>
                                <div class="tab-item" onclick="switchTab(event, ${idx}, 'trades')">EXECUTION LOG (${trader.trades.length})</div>
                            </div>
                            <div id="panel-${idx}-pos" class="tab-panel">
                                ${renderPosTable(trader.positions)}
                            </div>
                            <div id="panel-${idx}-trades" class="tab-panel" style="display:none">
                                ${renderTradeTable(trader.trades)}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderPosTable(positions) {
            if (!positions.length) return '<div style="color:var(--text-muted); font-size: 0.8rem;">No open positions found.</div>';
            return `
                <table class="pro-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Month</th>
                            <th>Side</th>
                            <th>Quantity</th>
                            <th>Entry Price</th>
                            <th>Closing Price</th>
                            <th>MTM (P&L)</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${positions.map(p => `
                            <tr>
                                <td><strong>${p.Symbol}</strong></td>
                                <td>${p.Month}</td>
                                <td class="${p.Side === 'B' ? 'val-buy' : 'val-sell'}"><strong>${p.Side === 'B' ? 'BUY' : 'SELL'}</strong></td>
                                <td>${p.Qty}</td>
                                <td>${p.AvgPrice.toFixed(4)}</td>
                                <td>${p.ClosingPrice.toFixed(4)}</td>
                                <td class="${p.MTM >= 0 ? 'val-pos' : 'val-neg'}"><strong>$${formatNum(p.MTM)}</strong></td>
                            </tr>
                        `).join('')}
                    </tbody>
                    <tfoot>
                        <tr style="background:#f8fafc; font-weight:700;">
                            <td colspan="6" style="text-align:right">TOTAL GROSS P&L:</td>
                            <td class="${sumPL(positions) >= 0 ? 'val-pos' : 'val-neg'}">$${formatNum(sumPL(positions))}</td>
                        </tr>
                    </tfoot>
                </table>
            `;
        }

        function renderTradeTable(trades) {
            if (!trades.length) return '<div style="color:var(--text-muted); font-size: 0.8rem;">No executions recorded for this session.</div>';
            return `
                <table class="pro-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Symbol</th>
                            <th>Side</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Trade Value</th>
                            <th>Exchange</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${trades.slice(0, 50).map(t => `
                            <tr>
                                <td style="color:var(--text-muted)">${t.Time}</td>
                                <td><strong>${t.Symbol}</strong></td>
                                <td class="${t.Side === 'B' ? 'val-buy' : 'val-sell'}">${t.Side === 'B' ? 'BUY' : 'SELL'}</td>
                                <td>${t.Qty.toLocaleString()}</td>
                                <td>${t.Price.toFixed(4)}</td>
                                <td>$${formatNum(t.Value)}</td>
                                <td>${t.Exchange}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function sumPL(positions) {
            return positions.reduce((s, p) => s + p.MTM, 0);
        }

        function toggleRow(idx) {
            document.getElementById(`trader-${idx}`).classList.toggle('open');
        }

        function switchTab(e, idx, type) {
            e.stopPropagation();
            const row = document.getElementById(`trader-${idx}`);
            row.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            e.target.classList.add('active');
            row.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
            document.getElementById(`panel-${idx}-${type}`).style.display = 'block';
        }

        function filterData() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const pos = document.getElementById('posSelect').value;
            filteredData = allData.filter(t => {
                const matchesSearch = t.account.toLowerCase().includes(search) || t.symbols.some(s => s.toLowerCase().includes(search));
                let matchesPos = true;
                if (pos === 'long') matchesPos = t.net_position > 0;
                if (pos === 'short') matchesPos = t.net_position < 0;
                if (pos === 'flat') matchesPos = t.net_position === 0;
                return matchesSearch && matchesPos;
            });
            renderTraders();
        }

        function sortData() {
            const val = document.getElementById('sortSelect').value;
            filteredData.sort((a, b) => {
                if (a.is_master && !b.is_master) return -1;
                if (!a.is_master && b.is_master) return 1;
                if (val === 'pl') return b.gross_pl - a.gross_pl;
                if (val === 'volume') return b.buy_value - a.buy_value;
                if (val === 'trades') return b.num_trades - a.num_trades;
                if (val === 'id') return a.account.localeCompare(b.account);
                return 0;
            });
            renderTraders();
        }

        function formatNum(n) {
            return n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        loadDashboard();
    </script>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</body>

</html>
